name: Docker

# Pull requests build every image for all platforms without pushing.
# Version tags (vX.Y.Z) push ghcr.io/<owner>/gsm2http. release-please.yml also calls this
# workflow after it creates a release, because tags pushed with GITHUB_TOKEN do not
# trigger other workflows.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish, e.g. v0.1.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: docker-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  build:
    name: Build ${{ matrix.image }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gsm2http
            dockerfile: Dockerfile
          - image: gsm2http-backend
            dockerfile: backend/Dockerfile
          - image: gsm2http-web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  publish:
    name: Publish gsm2http
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Resolve image name and version
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "image=ghcr.io/${OWNER,,}/gsm2http" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.vars.outputs.image }}
          # latest only for stable releases (no "-alpha.1"-style suffix).
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.vars.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.vars.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.vars.outputs.version }},enable=${{ !startsWith(steps.vars.outputs.version, '0.') }}
            type=raw,value=latest,enable=${{ !contains(steps.vars.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=gsm2http
            org.opencontainers.image.description=Self-hosted SMS and call-control gateway for USB GSM/3G/LTE modems: REST API in, webhooks out.
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=gsm2http
          cache-to: type=gha,scope=gsm2http,mode=max
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
