name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        gsm2http is for personal, home-automation and small-site use. Features whose main purpose is bulk or campaign sending, SIM rotation or pooling, IMEI changes, or getting around carrier controls will be declined. See "Responsible use" in the README.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what you're trying to do, not just the solution.
      placeholder: When my alarm triggers I want to … but currently …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API shape, event payload, config option, UI change…
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [REST API, Webhooks / events, Socket.io, Web UI, Modem / driver support, Docs / recipes, Deployment / packaging, Other]
  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to contribute this?
      options: ["Yes", "With guidance", "No"]
