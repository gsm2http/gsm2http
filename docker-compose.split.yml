# gsm2http as two containers: backend (API + modems) and web (nginx serving the UI and
# proxying /api and /socket.io to the backend). Use this if you want to put the UI behind
# its own reverse proxy or restart it separately.
#
#   docker compose -f docker-compose.split.yml up -d --build
#
# The single-container docker-compose.yml is simpler for most setups.
name: gsm2http

services:
  backend:
    image: ${GSM2HTTP_BACKEND_IMAGE:-gsm2http-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: '9333'
      HOST: '0.0.0.0'
    # API published for automations (n8n, Home Assistant, scripts). Remove this to
    # reach the API only through the web container.
    ports:
      - '${GSM2HTTP_BIND:-127.0.0.1}:${GSM2HTTP_PORT:-9333}:9333'
    # Modem access: see docker-compose.yml.
    devices:
      - /dev/ttyUSB0
      - /dev/ttyUSB1
      - /dev/ttyUSB2
    group_add:
      - '${DIALOUT_GID:-20}'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9333/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    image: ${GSM2HTTP_WEB_IMAGE:-gsm2http-web:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:9333
    ports:
      - '${GSM2HTTP_BIND:-127.0.0.1}:${GSM2HTTP_WEB_PORT:-9334}:8080'
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
      # nginx renders its config from the template at start (uid 101 = nginx)
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
