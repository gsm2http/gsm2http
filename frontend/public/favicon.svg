<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Outer Signal Wave -->
  <path d="M12 24 C 20 15, 44 15, 52 24" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M17 30 C 23 23, 41 23, 47 30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M22 36 C 26 31, 38 31, 42 36" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Radio/Antenna Mast -->
  <!-- Top Beacon -->
  <circle cx="32" cy="40" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />

  <!-- Tower legs -->
  <path d="M32 43 L 32 54" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <path d="M25 54 L 39 54" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <path d="M28 48 L 36 48" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
</svg>
